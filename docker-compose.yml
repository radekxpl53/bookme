services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bookme_app
    working_dir: /var/www/html
    command: bash docker/entrypoint.sh
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: bookme_db
    environment:
      POSTGRES_DB: bookme
      POSTGRES_USER: bookme
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
